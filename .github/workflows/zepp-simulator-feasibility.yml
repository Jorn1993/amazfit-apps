name: Zepp Simulator boot feasibility (experimental)
on:
  push:
    branches:
      - 'research/zepp-simulator-ci'
    paths:
      - '.github/workflows/zepp-simulator-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Linux GUI test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth x11-apps scrot xdotool python3-pil libxss1 libcapstone4 libaio1t64 libsdl2-2.0-0 curl
      - name: Download official Zepp Simulator 2.1.2 Linux amd64
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            -o /tmp/zepp-simulator.deb \
            'https://upload-cdn.zepp.com/zepp-applet-and-wechat-applet/20260717/simulator_2.1.2_linux_amd64.deb'
          dpkg-deb --field /tmp/zepp-simulator.deb Package Version Architecture
          dpkg-deb --contents /tmp/zepp-simulator.deb | head -n 25 || true
      - name: Install official Zepp simulator
        run: |
          sudo apt-get install -y /tmp/zepp-simulator.deb
          command -v simulator || true
          test -e /opt/simulator/simulator || find /opt /usr/bin -maxdepth 4 -iname '*simulator*' -type f | head -n 20
      - name: Boot Zepp Simulator and open Zepp Account sign-in
        run: |
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp > /tmp/zepp-xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          ELECTRON_DISABLE_SANDBOX=1 /opt/simulator/simulator --no-sandbox > /tmp/zepp-simulator.log 2>&1 &
          sleep 10
          xdotool mousemove --sync 1115 132 click 1
          sleep 3
      - name: Authenticate Zepp account from repository secrets
        env:
          ZEPP_EMAIL: ${{ secrets.ZEPP_ACCOUNT_EMAIL }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_ACCOUNT_PASSWORD }}
        run: |
          set +x
          if [ -z "$ZEPP_EMAIL" ] || [ -z "$ZEPP_PASSWORD" ]; then
            echo 'Missing Zepp account Actions secrets; skipping login.'
            exit 1
          fi
          export DISPLAY=:99
          umask 077
          input_file="$(mktemp /dev/shm/zepp-login.XXXXXXXX)"
          trap 'rm -f "$input_file"' EXIT
          # Temporary memory-backed file keeps secrets out of process arguments.
          printf '%s' "$ZEPP_EMAIL" > "$input_file"
          xdotool mousemove --sync 615 310 click 1
          xdotool type --clearmodifiers --delay 40 --file "$input_file"
          printf '%s' "$ZEPP_PASSWORD" > "$input_file"
          xdotool mousemove --sync 610 381 click 1
          xdotool type --clearmodifiers --delay 50 --file "$input_file"
          rm -f "$input_file"
          unset ZEPP_EMAIL ZEPP_PASSWORD
          xdotool mousemove --sync 645 534 click 1
          sleep 14
          xdotool mousemove --sync 1115 132 click 1 || true
          sleep 5
          # Exact model and position verified in prior redacted screenshots:
          # Balance2, latest v1.1.0, OS 5.0, API 4.2.
          mkdir -p simulator-ci
          xdotool mousemove --sync 990 650 click --repeat 6 --delay 90 5
          sleep 3
          xdotool mousemove --sync 1097 596 click 1
          sleep 25
          scrot -z /tmp/balance2-downloaded.png
          # Close catalogue and select downloaded model in simulator toolbar.
          xdotool mousemove --sync 1112 208 click 1
          sleep 3
          scrot -z /tmp/balance2-main-window.png
          xdotool mousemove --sync 986 134 click 1
          sleep 3
          scrot -z /tmp/balance2-device-menu.png
          xdotool type --clearmodifiers --delay 45 'Balance2'
          xdotool key Return
          sleep 3
          scrot -z /tmp/balance2-device-selected.png
          xdotool mousemove --sync 270 132 click 1
          sleep 28
          scrot -z /tmp/balance2-device-launch.png
          # Only the screenshots with sensitive regions masked are uploaded.
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          names=('downloaded','main-window','device-menu','device-selected','device-launch')
          for name in names:
              im=Image.open('/tmp/balance2-'+name+'.png').convert('RGB')
              d=ImageDraw.Draw(im)
              d.rectangle((0,0,1280,90),fill=(15,15,15))
              d.rectangle((115,90,225,195),fill=(15,15,15))
              # Mask login form if the account session was not established.
              d.rectangle((468,281,812,416),fill=(15,15,15))
              im.save('simulator-ci/balance2-'+name+'-redacted.png')
          PY
          test -s simulator-ci/balance2-device-launch-redacted.png
      - name: Upload redacted simulator status (no session data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zepp-balance2-device-launch
          path: simulator-ci/balance2-*-redacted.png
          if-no-files-found: warn
