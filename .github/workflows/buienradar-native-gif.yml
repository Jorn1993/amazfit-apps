name: Buienradar native GIF decoder verification
on:
  push:
    branches: ['feature/buienradar-native-gif', 'fix/buienradar-fullscreen-visible-radar', 'fix/buienradar-zml-file-delivery', 'fix/buienradar-native-conversion-frames']
    paths:
      - 'apps/buienradar/**'
      - '.github/workflows/buienradar-native-gif.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and run complete test suite
        run: |
          node --check apps/buienradar/page/index.js
          node --check apps/buienradar/app-side/index.js
          node --check apps/buienradar/page/gif-decoder.js
          node --check apps/buienradar/app-side/frame-png.js
          node --check apps/buienradar/secondary-widget/index.js
          node --test apps/buienradar/tests/*.test.mjs
      - name: Get live official Buienradar Belgium forecast GIF
        run: |
          curl -fL --max-time 35 --retry 2 -o /tmp/buienradar-live.gif 'https://image.buienradar.nl/2.0/image/animation/RadarMapRainWebmercatorBE?height=320&width=320&renderBackground=True&renderBranding=False&renderText=True&History=0&Forecast=19&skip=1'
          file /tmp/buienradar-live.gif
          BUIENRADAR_REAL_GIF=/tmp/buienradar-live.gif node --test apps/buienradar/tests/native-gif.test.mjs apps/buienradar/tests/frame-png.test.mjs
      - name: Verify genuine future PNG is real RGB image with Pillow
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/buienradar-forecast-frame.png')
          im.load()
          assert im.format=='PNG' and im.mode=='RGB' and im.size==(320,320)
          print('Future frame PNG:',im.format,im.mode,im.size)
          PY
