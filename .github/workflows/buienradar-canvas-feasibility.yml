name: Buienradar GIF canvas rendering cost experiment
on:
  push:
    branches: ['feature/buienradar-verified-core']
    paths: ['.github/workflows/buienradar-canvas-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect real future-GIF drawRect run count
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          import requests, io, collections
          from PIL import Image,ImageSequence
          u='https://image.buienradar.nl/2.0/image/animation/RadarMapRainWebmercatorBE'
          r=requests.get(u,params={'width':320,'height':320,'renderBackground':'True','renderBranding':'False','renderText':'True','History':0,'Forecast':19,'skip':1},timeout=60)
          r.raise_for_status()
          im=Image.open(io.BytesIO(r.content))
          print('ORIGINAL',im.format,im.size,'bytes',len(r.content),'frames',getattr(im,'n_frames',1))
          first=im.convert('RGB')
          for step in [2,3,4,5,6]:
            counts=[]
            for j in range(min(9,im.n_frames)):
              im.seek(j)
              rgb=im.convert('RGB')
              w,h=rgb.size
              sampled=[ [rgb.getpixel((min(w-1,x),min(h-1,y))) for x in range(step//2,w,step)] for y in range(step//2,h,step) ]
              active={},dict()
              active={}
              rectangles=0;pixels=0
              for row in sampled:
                runs=[];x=0
                while x<len(row):
                  start=x;color=row[x]
                  while x<len(row) and row[x]==color:x+=1
                  runs.append((start,x-start,color))
                next_active={}
                for run in runs:
                  if run in active:next_active[run]=active[run]+1
                  else:rectangles+=1;next_active[run]=1
                active=next_active
              counts.append(rectangles)
            print('SAMPLE STEP',step,'fullframe rectangle counts',counts,'mean',round(sum(counts)/len(counts)))
          PY
