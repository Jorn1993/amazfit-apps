name: Buienradar — refresh official animation frames
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/buienradar-radar.yml'
      - 'apps/buienradar/tools/extract_radar.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: buienradar-radar-feed
  cancel-in-progress: true
jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain verified multi-frame animation directly from Buienradar
        run: |
          python -m pip install --quiet requests pillow
          python apps/buienradar/tools/extract_radar.py
      - name: Publish replaceable public snapshot (no accumulating Git history)
        run: |
          set -euo pipefail
          cp -a /tmp/buienradar-radar-cache /tmp/buienradar-radar-verified
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan radar-cache-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p radar
          cp -a /tmp/buienradar-radar-verified/. radar/
          git add radar
          git commit -m "data(buienradar): verified official radar animation snapshot"
          git push --force origin HEAD:refs/heads/radar-cache
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: radar-failure-information
          path: /tmp/buienradar-radar-cache/
          if-no-files-found: ignore
