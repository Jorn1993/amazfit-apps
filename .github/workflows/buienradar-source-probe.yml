name: Buienradar source format probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/buienradar-source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests pillow
      - name: Inspect genuine Buienradar BE animation formats and frames
        run: |
          python - <<'PY'
          import io,requests
          from PIL import Image
          base='https://image.buienradar.nl/2.0/image/animation/RadarMapRainWebmercatorBE'
          variants={
           'future-default':{'height':240,'width':240,'renderBackground':'True','renderBranding':'False','renderText':'True','History':0,'Forecast':19,'skip':1},
           'future-extension-png':{'height':240,'width':240,'extension':'png','renderBackground':'True','renderBranding':'False','renderText':'True','History':0,'Forecast':19,'skip':1},
           'future-extension-gif':{'height':240,'width':240,'extension':'gif','renderBackground':'True','renderBranding':'False','renderText':'True','History':0,'Forecast':19,'skip':1},
           'future-alt-layer':{'height':240,'width':240,'History':0,'Forecast':19}
          }
          for label,query in variants.items():
           try:
            response=requests.get(base,params=query,timeout=20)
            print(label,'http',response.status_code,'content-type',response.headers.get('Content-Type'),
              'bytes',len(response.content),'signature',repr(response.content[:8]))
            response.raise_for_status()
            with Image.open(io.BytesIO(response.content)) as image:
             print(label,'format',image.format,'dimensions',image.size,'frames',getattr(image,'n_frames',1),
              'duration',image.info.get('duration'))
           except Exception as e:
            print(label,'ERROR',str(e)[:300])
          PY
          # Confirm whether a public image transformer can extract *different* forecast frames.
          python - <<'PY'
          import requests,io,hashlib
          from PIL import Image,ImageChops
          src='https://image.buienradar.nl/2.0/image/animation/RadarMapRainWebmercatorBE?height=240&width=240&renderBackground=True&renderBranding=False&renderText=True&History=0&Forecast=19&skip=1'
          s=requests.Session()
          ref=s.get(src,timeout=35);ref.raise_for_status()
          g=Image.open(io.BytesIO(ref.content));print('Reference GIF frames:',g.n_frames)
          endpoints=['https://images.weserv.nl/']
          for endpoint in endpoints:
           frames=[]
           for n in [0,1,5,10,16]:
            params={'url':src,'page':n,'n':1,'output':'png'}
            try:
             resp=s.get(endpoint,params=params,timeout=35)
             with Image.open(io.BytesIO(resp.content)) as im:
              im.load()
              print('Proxy frame',n,'http',resp.status_code,'type',resp.headers.get('Content-Type'),
                'format',im.format,'bytes',len(resp.content),'md5',hashlib.md5(resp.content).hexdigest(),
                'sample',im.convert('RGB').getpixel((120,120)))
              frames.append(im.convert('RGB').copy())
            except Exception as e:print('Proxy ERROR',n,resp.status_code,str(e)[:160])
           if len(frames)>1:
            print('Proxy pixel changes',[(ImageChops.difference(frames[0],im).getbbox() is not None) for im in frames[1:]])
          PY
